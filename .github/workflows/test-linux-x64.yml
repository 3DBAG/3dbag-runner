name: Test and lint on Linux

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PDAL_VERSION: "2.8-maintenance"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin libgdal-dev build-essential git cmake pkg-config \
            libgeotiff-dev liblaszip-dev libproj-dev libxml2-dev libzstd-dev \
            liblzma-dev python3-dev

      - name: Cache PDAL installation
        id: cache-pdal
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/bin/pdal
            /usr/local/lib/libpdal*
            /usr/local/include/pdal
          key: pdal-${{ runner.os }}-${{ env.PDAL_VERSION }}-v3

      - name: Build and install PDAL
        if: steps.cache-pdal.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          
          # Clone and build PDAL (matching Dockerfile)
          git clone --branch "${PDAL_VERSION}" --depth 1 https://github.com/PDAL/PDAL.git
          cd PDAL
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          sudo make install
          cd ../..
          rm -rf PDAL

      - name: Update library cache
        shell: bash
        run: sudo ldconfig

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run linters
        run: |
          uv run flake8 ./src
          uv run mypy ./src


        
